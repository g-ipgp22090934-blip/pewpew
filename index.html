<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direction & Preposition Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake-animation {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes bounce-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pop-animation {
            animation: bounce-pop 0.3s ease-out both;
        }

        /* Styling for the option buttons to look like Quizizz/Duolingo */
        .quiz-btn {
            transition: all 0.2s ease;
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.1);
        }
        .quiz-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 0 rgba(0,0,0,0.1);
        }
        .quiz-btn.correct {
            background-color: #58cc02 !important; /* Duolingo green */
            color: white !important;
            border-color: #58cc02 !important;
            box-shadow: 0 4px 0 0 #46a302;
        }
        .quiz-btn.wrong {
            background-color: #ff4b4b !important; /* Duolingo red */
            color: white !important;
            border-color: #ff4b4b !important;
            box-shadow: 0 4px 0 0 #cc3c3c;
        }

        /* SVG Heart styles */
        .heart {
            fill: #ff4b4b;
            transition: fill 0.3s ease, transform 0.3s ease;
        }
        .heart.lost {
            fill: #e5e7eb; /* gray-200 */
            transform: scale(0.8);
        }

        /* Canvas for confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen font-sans flex items-center justify-center p-4 selection:bg-pink-300">

    <!-- Screen 1: Start Screen -->
    <div id="start-screen" class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl transition-all duration-300">
        <div class="mb-6 flex justify-center">
            <svg class="w-24 h-24 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
            </svg>
        </div>
        <h1 class="text-3xl font-extrabold text-gray-800 mb-4">Mini Game B: <br> Where is it?</h1>
        <p class="text-gray-600 mb-8 font-medium">Test your knowledge! You have 3 lives. Can you make it to the end?</p>
        <button onclick="startGame()" class="w-full bg-purple-600 text-white font-bold py-4 px-6 rounded-2xl text-xl shadow-[0_6px_0_0_#6b21a8] hover:bg-purple-500 active:shadow-[0_0px_0_0_#6b21a8] active:translate-y-1.5 transition-all">
            Start Game!
        </button>
    </div>

    <!-- Screen 2: Quiz Screen -->
    <div id="quiz-screen" class="hidden bg-white rounded-3xl p-6 md:p-8 max-w-2xl w-full shadow-2xl transition-all duration-300 relative">
        
        <!-- Header: Progress & Lives -->
        <div class="flex justify-between items-center mb-6">
            <div class="w-1/2 bg-gray-200 rounded-full h-3">
                <div id="progress-bar" class="bg-purple-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex space-x-1" id="lives-container">
                <!-- Hearts will be generated via JS -->
            </div>
        </div>

        <!-- Visual Image Container -->
        <div id="visual-container" class="mb-6 h-48 sm:h-56 bg-indigo-50/50 rounded-2xl border-4 border-indigo-100 flex items-center justify-center overflow-hidden relative shadow-inner">
            <!-- Visual injected via JS -->
        </div>

        <!-- Question -->
        <div class="mb-8 text-center">
            <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-gray-800 leading-tight">Loading question...</h2>
        </div>

        <!-- Options Grid -->
        <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Buttons generated via JS -->
        </div>
        
        <!-- Feedback Message (Hidden initially) -->
        <div id="feedback-msg" class="h-8 mt-4 text-center font-bold text-lg hidden"></div>
    </div>

    <!-- Screen 3: Game Over Screen -->
    <div id="game-over-screen" class="hidden bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl">
        <div class="mb-6 flex justify-center text-red-500">
            <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
            </svg>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Out of Lives!</h2>
        <p class="text-gray-600 mb-8 font-medium">You got 3 questions wrong. Let's try again and learn from our mistakes.</p>
        <button onclick="resetGame()" class="w-full bg-red-500 text-white font-bold py-4 px-6 rounded-2xl text-xl shadow-[0_6px_0_0_#991b1b] hover:bg-red-400 active:shadow-[0_0px_0_0_#991b1b] active:translate-y-1.5 transition-all">
            Try Again
        </button>
    </div>

    <!-- Screen 4: Win Screen -->
    <div id="win-screen" class="hidden bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative z-10">
        <div class="mb-6 flex justify-center text-green-500">
            <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
            </svg>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Awesome Job!</h2>
        <p class="text-gray-600 mb-8 font-medium">You mastered the directions and prepositions.</p>
        <button onclick="resetGame()" class="w-full bg-green-500 text-white font-bold py-4 px-6 rounded-2xl text-xl shadow-[0_6px_0_0_#166534] hover:bg-green-400 active:shadow-[0_0px_0_0_#166534] active:translate-y-1.5 transition-all">
            Play Again
        </button>
    </div>

    <!-- Canvas for Confetti -->
    <canvas id="confetti-canvas"></canvas>

    <script>
        // --- GAME DATA & VISUALS ---
        
        const visuals = {
            go_straight: `<svg class="w-32 h-32 text-blue-500 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 19V5m0 0l-5 5m5-5l5 5"></path></svg>`,
            turn_left: `<svg class="w-32 h-32 text-blue-500 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h8a4 4 0 014 4v5"></path></svg>`,
            turn_right: `<svg class="w-32 h-32 text-blue-500 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H6a4 4 0 00-4 4v5"></path></svg>`,
            stop: `<svg class="w-32 h-32 text-red-500 drop-shadow-lg" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M8.27 2H15.73L22 8.27V15.73L15.73 22H8.27L2 15.73V8.27L8.27 2Z" /><text x="12" y="13.5" font-size="6" font-family="sans-serif" font-weight="bold" fill="white" text-anchor="middle">STOP</text></svg>`,
            next_to: `<svg class="w-40 h-40 drop-shadow-md" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="30" width="30" height="40" rx="4" fill="#9CA3AF"/><circle cx="70" cy="50" r="15" fill="#3B82F6"/></svg>`,
            opposite: `<svg class="w-40 h-40 drop-shadow-md" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="30" height="30" rx="4" fill="#9CA3AF"/><rect x="60" y="60" width="30" height="30" rx="4" fill="#F59E0B"/><line x1="10" y1="50" x2="90" y2="50" stroke="#D1D5DB" stroke-width="4" stroke-dasharray="6 6"/></svg>`,
            between: `<svg class="w-40 h-40 drop-shadow-md" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="30" width="20" height="40" rx="4" fill="#9CA3AF"/><circle cx="50" cy="50" r="12" fill="#3B82F6"/><rect x="70" y="30" width="20" height="40" rx="4" fill="#9CA3AF"/></svg>`,
            in_front_of: `<svg class="w-40 h-40 drop-shadow-md" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="20" width="40" height="40" rx="4" fill="#9CA3AF"/><circle cx="50" cy="65" r="18" fill="#3B82F6"/></svg>`,
            behind: `<svg class="w-40 h-40 drop-shadow-md" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="35" r="18" fill="#3B82F6"/><rect x="30" y="45" width="40" height="40" rx="4" fill="#9CA3AF"/></svg>`
        };

        const allQuestions = [
            {
                visual: visuals.go_straight,
                question: "What does this movement mean?",
                options: ["go straight", "turn left", "turn right", "stop"],
                answerIndex: 0
            },
            {
                visual: visuals.next_to,
                question: "Where is the blue ball compared to the box?",
                options: ["between", "next to", "opposite", "behind"],
                answerIndex: 1
            },
            {
                visual: visuals.opposite,
                question: "The two boxes are separated by a road. Where are they?",
                options: ["behind", "in front of", "opposite", "next to"],
                answerIndex: 2
            },
            {
                visual: visuals.stop,
                question: "What must you do here?",
                options: ["go straight", "turn left", "turn right", "stop"],
                answerIndex: 3
            },
            {
                visual: visuals.turn_right,
                question: "Which direction is this arrow pointing?",
                options: ["turn right", "stop", "go straight", "turn left"],
                answerIndex: 0
            },
            {
                visual: visuals.behind,
                question: "Where is the blue ball hiding?",
                options: ["in front of", "between", "opposite", "behind"],
                answerIndex: 3
            },
            {
                visual: visuals.between,
                question: "Where is the blue ball?",
                options: ["between", "next to", "opposite", "in front of"],
                answerIndex: 0
            },
            {
                visual: visuals.turn_left,
                question: "Which direction is this arrow pointing?",
                options: ["turn right", "go straight", "turn left", "stop"],
                answerIndex: 2
            },
            {
                visual: visuals.in_front_of,
                question: "Where is the blue ball now?",
                options: ["behind", "in front of", "between", "next to"],
                answerIndex: 1
            }
        ];

        // --- GAME STATE ---
        let questions = [];
        let currentQuestionIndex = 0;
        let lives = 3;
        let isAnswering = false;

        // --- AUDIO SYSTEM (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                // Happy "ding" sound
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // A5
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                // Sad "bloop" sound
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- DOM ELEMENTS ---
        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            gameOver: document.getElementById('game-over-screen'),
            win: document.getElementById('win-screen')
        };
        const visualContainer = document.getElementById('visual-container');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const progressBar = document.getElementById('progress-bar');
        const livesContainer = document.getElementById('lives-container');
        const feedbackMsg = document.getElementById('feedback-msg');

        // --- UTILITY FUNCTIONS ---
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(screen => {
                screen.classList.add('hidden');
                screen.classList.remove('flex');
            });
            screens[screenName].classList.remove('hidden');
            if (screenName === 'quiz') screens[screenName].classList.add('flex', 'flex-col');
        }

        // --- GAME LOGIC ---
        function startGame() {
            // Shuffle questions for variety
            questions = shuffle([...allQuestions]);
            currentQuestionIndex = 0;
            lives = 3;
            isAnswering = false;
            
            // Resume audio context inside user gesture
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            renderLives();
            updateProgressBar();
            loadQuestion();
            showScreen('quiz');
        }

        function renderLives() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heartSvg = `
                    <svg class="w-8 h-8 heart ${i >= lives ? 'lost' : ''}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                `;
                livesContainer.innerHTML += heartSvg;
            }
        }

        function updateProgressBar() {
            const percentage = (currentQuestionIndex / questions.length) * 100;
            progressBar.style.width = `${percentage}%`;
        }

        function loadQuestion() {
            isAnswering = false;
            feedbackMsg.classList.add('hidden');
            feedbackMsg.classList.remove('text-green-500', 'text-red-500');
            
            const currentQ = questions[currentQuestionIndex];
            
            // Load Visual and Text
            visualContainer.innerHTML = currentQ.visual;
            questionText.innerText = currentQ.question;
            
            optionsGrid.innerHTML = '';
            
            currentQ.options.forEach((optionText, index) => {
                const button = document.createElement('button');
                button.className = 'quiz-btn bg-white border-2 border-gray-200 text-gray-700 font-bold py-4 px-6 rounded-2xl text-xl hover:bg-gray-50 focus:outline-none w-full break-words';
                button.innerText = optionText;
                button.onclick = () => handleAnswer(index, button);
                optionsGrid.appendChild(button);
            });
        }

        function handleAnswer(selectedIndex, buttonElement) {
            if (isAnswering) return; // Prevent multiple clicks
            isAnswering = true;
            
            const currentQ = questions[currentQuestionIndex];
            const isCorrect = (selectedIndex === currentQ.answerIndex);
            
            if (isCorrect) {
                playSound('correct');
                buttonElement.classList.add('correct', 'pop-animation');
                feedbackMsg.innerText = "Excellent!";
                feedbackMsg.classList.add('text-green-500');
            } else {
                playSound('wrong');
                buttonElement.classList.add('wrong', 'shake-animation');
                feedbackMsg.innerText = "Oops, that's not it!";
                feedbackMsg.classList.add('text-red-500');
                lives--;
                renderLives();
                
                // Highlight correct answer
                const buttons = optionsGrid.children;
                buttons[currentQ.answerIndex].classList.add('correct');
            }
            
            feedbackMsg.classList.remove('hidden');

            setTimeout(() => {
                if (lives <= 0) {
                    showScreen('gameOver');
                } else {
                    currentQuestionIndex++;
                    updateProgressBar();
                    if (currentQuestionIndex >= questions.length) {
                        triggerWin();
                    } else {
                        loadQuestion();
                    }
                }
            }, 1500); // Wait 1.5s before moving to next question
        }

        function resetGame() {
            stopConfetti();
            startGame();
        }

        function triggerWin() {
            showScreen('win');
            startConfetti();
        }

        // --- CONFETTI SYSTEM ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;
        let width, height;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#f472b6', '#c084fc', '#60a5fa', '#34d399', '#fbbf24'];

        function createParticles() {
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height - height,
                    r: Math.random() * 6 + 2,
                    dx: Math.random() * 4 - 2,
                    dy: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleIncrement: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
        }

        function drawConfetti() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncrement;
                p.y += (Math.cos(p.tiltAngle) + p.dy + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle);

                if (p.y > height) {
                    p.y = -10;
                    p.x = Math.random() * width;
                }

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();
            });

            animationId = requestAnimationFrame(drawConfetti);
        }

        function startConfetti() {
            createParticles();
            drawConfetti();
        }

        function stopConfetti() {
            cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, width, height);
            particles = [];
        }

    </script>
</body>
</html>
